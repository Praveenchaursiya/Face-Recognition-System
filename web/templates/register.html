{% extends 'base.html' %}{% block content %}<div class="page-title"><div><h1>Register employee</h1><p>Capture one clear, front-facing face in good light.</p></div></div>{% if not camera_ready %}<div class="alert danger">Face models are unavailable. {{ config.get('model_error','') }}</div>{% endif %}<form method="post" class="card register-form" id="face-form"><div class="form-grid"><label>Employee ID<input required name="employee_id" maxlength="50"></label><label>Full name<input required name="full_name" maxlength="100"></label><label>Department<input name="department" maxlength="100"></label><label>Email<input type="email" name="email" maxlength="254"></label></div><input type="hidden" name="face_image" id="face-image"><div class="capture"><video id="camera" autoplay muted playsinline aria-label="Webcam preview"></video><canvas id="snapshot" hidden></canvas><button type="button" id="capture">Capture face</button><span id="capture-status" class="muted">Requesting camera access…</span></div><button type="submit">Register employee</button></form>{% endblock %}
