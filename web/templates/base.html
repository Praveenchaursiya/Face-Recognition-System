<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}FaceAttend{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
{% if session.admin_id %}<header><a class="brand" href="{{ url_for('dashboard') }}">FaceAttend</a><nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('register') }}">Register</a><a href="{{ url_for('recognition') }}">Recognize</a><a href="{{ url_for('attendance') }}">Attendance</a><a href="{{ url_for('users') }}">Users</a><form action="{{ url_for('logout') }}" method="post"><button class="link">Sign out</button></form></nav></header>{% endif %}
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for type,message in messages %}<div class="alert {{ type }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
